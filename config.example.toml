# RustTube Configuration
# Stored persistently in %APPDATA%\RustTube\RustTube\config\config.toml on Windows 11
# Application updates never overwrite this file. Never commit real secrets to version control.

[auth]
google_client_id = "YOUR_GOOGLE_OAUTH_DESKTOP_CLIENT_ID.apps.googleusercontent.com"
google_client_secret = ""
redirect_port = 8989
keyring_service_name = "RustTube_Google_OAuth"
auto_restore_session = true

[sync]
auto_sync_enabled = true
sync_interval_minutes = 30
max_uploads_per_channel = 10

[playback]
hwdec = "auto-safe"
default_quality = "1080p"
default_volume = 80
default_speed = 1.0
resume_playback = true

[ytdlp]
binary_path = "bin/yt-dlp.exe"
cookies_browser = "none" # Options: "none", "chrome", "edge", "firefox"
experimental_cookie_home_feed = false
experimental_cookie_watch_later = false

[storage]
# Leave empty to use default %LOCALAPPDATA%\RustTube\data
custom_data_dir = ""
thumbnail_cache_mb = 256

[updater]
auto_check_updates = true
include_prereleases = false
github_repo = "duongducdungnguyen-dot/RustTube"
